name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Cache wake-word model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/model-wake
          key: wake-model-${{ hashFiles('tools/fetch_wake_model.sh') }}

      - name: Fetch wake-word model
        run: bash tools/fetch_wake_model.sh

      - name: Build debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee assemble.log

      - name: Run unit tests
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --continue --console=plain 2>&1 | tee test.log

      - name: Build release APK and bundle (not debuggable, minified)
        id: release
        continue-on-error: true
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -o pipefail
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PW" ]; then
            echo "$KS_B64" | base64 -d > "$KS"; echo "signed=real" >> "$GITHUB_OUTPUT"
          else
            # No release key in the secrets yet: sign with a throwaway key so the emulator can still test this
            # exact build. A build signed this way is never published.
            KS_PW=throwaway-$RANDOM$RANDOM; KS_ALIAS=follower
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias follower -keyalg RSA -keysize 2048 -validity 30 \
              -storepass "$KS_PW" -keypass "$KS_PW" -dname "CN=Follower throwaway test key" >/dev/null 2>&1
            echo "signed=throwaway" >> "$GITHUB_OUTPUT"
          fi
          RELEASE_STORE_FILE="$KS" RELEASE_STORE_PASSWORD="$KS_PW" RELEASE_KEY_ALIAS="${KS_ALIAS:-follower}" \
            ./gradlew assembleRelease bundleRelease --console=plain 2>&1 | tee release.log
          rm -f "$KS"

      - name: Verify the release APK (not debuggable, HTTPS only, properly signed, no AI key)
        id: verify
        if: steps.release.outcome == 'success'
        continue-on-error: true
        run: |
          set -eo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          {
            echo "== badging"; "$BT/aapt2" dump badging "$APK"
            echo "== manifest"; "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK"
            echo "== signature"; "$BT/apksigner" verify --verbose --print-certs "$APK"
          } > release-check.txt 2>&1
          fail() { echo "RELEASE CHECK FAILED: $1" | tee -a release-check.txt; exit 1; }
          grep -q "application-debuggable" release-check.txt && fail "debuggable"
          grep -q 'usesCleartextTraffic.*=false' release-check.txt || fail "cleartext traffic not switched off"
          grep -q "networkSecurityConfig" release-check.txt && fail "test network config inside the release"
          grep -qi "PreviewActivity" release-check.txt && fail "debug preview activity inside the release"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" release-check.txt || fail "no v2 signature"
          grep -q "CN=Android Debug" release-check.txt && fail "signed with the debug key"
          unzip -l "$APK" > apk-files.txt
          grep -q "lib/x86_64/" apk-files.txt && fail "emulator-only native code inside the release"
          unzip -p "$APK" 'classes*.dex' > dex.bin
          grep -aqE 'AIza[0-9A-Za-z_-]{30}|sk-or-v1-[0-9a-f]{20}|cloud_key_enc' dex.bin && fail "an AI key or key storage in the app"
          grep -aq 'http://10.0.2.2' dex.bin && fail "test server address inside the release"
          rm -f dex.bin
          echo "RELEASE CHECK PASSED" | tee -a release-check.txt

      - name: Upload APKs
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AIStockAssistant-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Publish results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/tests
          cp assemble.log test.log release.log release-check.txt out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          if [ "${{ steps.release.outputs.signed }}" = real ]; then
            cp app/build/outputs/apk/release/app-release.apk app/build/outputs/bundle/release/app-release.aab out/ 2>/dev/null || true
            cp app/build/outputs/mapping/release/mapping.txt out/ 2>/dev/null || true
          fi
          cp app/build/test-results/testDebugUnitTest/*.xml out/tests/ 2>/dev/null || true
          cp -r app/schemas out/schemas 2>/dev/null || true
          echo "$GITHUB_SHA" > out/sha.txt
          echo "assemble=${{ steps.assemble.outcome }} test=${{ steps.test.outcome }} release=${{ steps.release.outcome }} verify=${{ steps.verify.outcome }} signed=${{ steps.release.outputs.signed }}" > out/status.txt
          ls -la out > out/files.txt
          cd out
          git init -q -b ci-results
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "results for $GITHUB_SHA"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Publish downloadable APK (release "latest")
        if: steps.assemble.outcome == 'success' && steps.test.outcome == 'success' && steps.verify.outcome == 'success' && steps.release.outputs.signed == 'real'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Follower.apk
          cp app/build/outputs/bundle/release/app-release.aab Follower.aab
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest Follower.apk Follower.aab --target "$GITHUB_SHA" \
            --title "Follower - latest release build" \
            --notes "Release build of commit $GITHUB_SHA: not debuggable, minified, signed with the Follower release key. Follower.apk installs on phones; Follower.aab is for Google Play."

      - name: Fail if build or tests failed
        if: steps.assemble.outcome != 'success' || steps.test.outcome != 'success' || steps.release.outcome != 'success' || steps.verify.outcome != 'success'
        run: exit 1

  device-test:
    # Installs the APK on an emulator, drives the main flows and saves screenshots.
    # Runs when the commit message contains [device] or when started by hand.
    needs: build
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[device]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aistock
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start a test AIStock server (fake Google behind it)
        working-directory: server
        run: |
          npm ci
          nohup node test/fakeGemini.js > ../fake-gemini.log 2>&1 &
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/aistock JWT_SECRET=$(openssl rand -hex 32) GEMINI_API_KEY=test-key \
            GEMINI_BASE_URL=http://127.0.0.1:9090 REGISTER_PER_HOUR=100 UPI_ID=testshop@upi ADMIN_TOKEN=smoke-admin-token nohup node src/server.js > ../test-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
      - uses: actions/download-artifact@v4
        with:
          name: AIStockAssistant-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          ram-size: 3072M
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 tools/smoke.py apk/debug/app-debug.apk device-out; python3 tools/release_smoke.py apk/release/app-release.apk device-out/release
      - name: Publish device results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p device-out
          cp test-server.log device-out/ 2>/dev/null || true
          echo "$GITHUB_SHA" > device-out/sha.txt
          cd device-out
          git init -q -b ci-device
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "device results for $GITHUB_SHA"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-device

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aistock_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server unit and API tests
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aistock_test
        run: |
          npm ci
          npm test 2>&1 | tee server-test.log
      - name: Full stack in Docker (db + api + caddy), smoke test over HTTPS
        working-directory: server
        run: |
          cat > .env <<ENV
          DOMAIN=localhost
          POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)
          JWT_SECRET=$(openssl rand -hex 32)
          ADMIN_TOKEN=$(openssl rand -hex 16)
          GEMINI_API_KEY=
          ENV
          docker compose up -d --build
          for i in $(seq 1 40); do curl -skf https://localhost/healthz && break; sleep 3; done
          curl -skf https://localhost/healthz | tee stack.log
          curl -sk -X POST https://localhost/v1/auth/register -H 'content-type: application/json' \
            -d '{"email":"ci@shop.in","password":"ci password 1","businessName":"CI Shop"}' | tee -a stack.log | grep -q accessToken
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/admin/subscriptions)" = "404"
          echo "stack OK" | tee -a stack.log
          docker compose logs api | tail -20
      - name: Whisper container with a real model and real speech
        working-directory: server
        run: |
          sudo apt-get install -y -q espeak-ng >/dev/null
          espeak-ng -v en -w /tmp/en.wav "two XL shirts sold for cash"
          espeak-ng -v ta -w /tmp/ta.wav "இரண்டு சட்டை விற்பனை"
          docker build -q -t follower-whisper whisper
          docker run -d --name whisper -p 127.0.0.1:9000:9000 -e WHISPER_MODEL=medium follower-whisper
          for i in $(seq 1 240); do curl -sf 127.0.0.1:9000/health && break; sleep 5; done
          python3 - <<'PY' | tee whisper.log
          import base64, json, urllib.request, wave, array
          def pcm16k(path):
              w = wave.open(path); rate = w.getframerate(); a = array.array('h', w.readframes(w.getnframes()))
              n = int(len(a) * 16000 / rate); out = array.array('h', (a[min(len(a) - 1, int(i * rate / 16000))] for i in range(n)))
              return base64.b64encode(out.tobytes()).decode()
          res = {}
          for name, lang in (("en", "en-IN"), ("ta", "ta-IN")):
              req = urllib.request.Request("http://127.0.0.1:9000/transcribe", json.dumps({"audio": pcm16k(f"/tmp/{name}.wav"), "language": lang, "prompt": "Shirt XL"}).encode(), {"content-type": "application/json"})
              res[name] = json.load(urllib.request.urlopen(req, timeout=300))
              print(name, res[name])
          assert "shirt" in res["en"]["text"].lower(), "English speech was not understood"
          assert res["ta"]["text"].strip(), "Tamil speech gave no text"
          print("whisper OK")
          PY
          docker logs whisper | tail -5
      - name: Publish server results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out && cp server/server-test.log server/stack.log server/whisper.log out/ 2>/dev/null || true
          echo "$GITHUB_SHA" > out/sha.txt
          echo "${{ job.status }}" > out/status.txt
          cd out && git init -q -b ci-server && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "server results for $GITHUB_SHA"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-server
