name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Cache wake-word model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/model-wake
          key: wake-model-${{ hashFiles('tools/fetch_wake_model.sh') }}

      - name: Fetch wake-word model
        run: bash tools/fetch_wake_model.sh

      - name: Build debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee assemble.log

      - name: Run unit tests
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --continue --console=plain 2>&1 | tee test.log

      - name: Upload APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AIStockAssistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out/tests
          cp assemble.log test.log out/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*.apk out/ 2>/dev/null || true
          cp app/build/test-results/testDebugUnitTest/*.xml out/tests/ 2>/dev/null || true
          cp -r app/schemas out/schemas 2>/dev/null || true
          echo "$GITHUB_SHA" > out/sha.txt
          echo "assemble=${{ steps.assemble.outcome }} test=${{ steps.test.outcome }}" > out/status.txt
          ls -la out > out/files.txt
          cd out
          git init -q -b ci-results
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "results for $GITHUB_SHA"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Publish downloadable APK (release "latest")
        if: steps.assemble.outcome == 'success' && steps.test.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AIStockAssistant.apk
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest AIStockAssistant.apk --target "$GITHUB_SHA" \
            --title "AIStock Assistant - latest build" \
            --notes "Debug build of commit $GITHUB_SHA. All unit tests passed. Download AIStockAssistant.apk and open it on your Android phone to install."

      - name: Fail if build or tests failed
        if: steps.assemble.outcome != 'success' || steps.test.outcome != 'success'
        run: exit 1

  device-test:
    # Installs the APK on an emulator, drives the main flows and saves screenshots.
    # Runs when the commit message contains [device] or when started by hand.
    needs: build
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[device]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aistock
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start a test AIStock server (fake Google behind it)
        working-directory: server
        run: |
          npm ci
          nohup node test/fakeGemini.js > ../fake-gemini.log 2>&1 &
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/aistock JWT_SECRET=$(openssl rand -hex 32) GEMINI_API_KEY=test-key \
            GEMINI_BASE_URL=http://127.0.0.1:9090 REGISTER_PER_HOUR=100 nohup node src/server.js > ../test-server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
      - uses: actions/download-artifact@v4
        with:
          name: AIStockAssistant-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          ram-size: 3072M
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 tools/smoke.py apk/app-debug.apk device-out
      - name: Publish device results branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p device-out
          cp test-server.log device-out/ 2>/dev/null || true
          echo "$GITHUB_SHA" > device-out/sha.txt
          cd device-out
          git init -q -b ci-device
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "device results for $GITHUB_SHA"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-device

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aistock_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server unit and API tests
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/aistock_test
        run: |
          npm ci
          npm test 2>&1 | tee server-test.log
      - name: Full stack in Docker (db + api + caddy), smoke test over HTTPS
        working-directory: server
        run: |
          cat > .env <<ENV
          DOMAIN=localhost
          POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)
          JWT_SECRET=$(openssl rand -hex 32)
          ADMIN_TOKEN=$(openssl rand -hex 16)
          GEMINI_API_KEY=
          ENV
          docker compose up -d --build
          for i in $(seq 1 40); do curl -skf https://localhost/healthz && break; sleep 3; done
          curl -skf https://localhost/healthz | tee stack.log
          curl -sk -X POST https://localhost/v1/auth/register -H 'content-type: application/json' \
            -d '{"email":"ci@shop.in","password":"ci password 1","businessName":"CI Shop"}' | tee -a stack.log | grep -q accessToken
          test "$(curl -sk -o /dev/null -w '%{http_code}' -X POST https://localhost/admin/subscriptions)" = "404"
          echo "stack OK" | tee -a stack.log
          docker compose logs api | tail -20
      - name: Publish server results
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out && cp server/server-test.log server/stack.log out/ 2>/dev/null || true
          echo "$GITHUB_SHA" > out/sha.txt
          echo "${{ job.status }}" > out/status.txt
          cd out && git init -q -b ci-server && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "server results for $GITHUB_SHA"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-server
